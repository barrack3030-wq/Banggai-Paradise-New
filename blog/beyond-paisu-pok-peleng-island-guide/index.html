    <script>
      (function () {
        var langs = ["id", "eng", "es"], t = 'eng';
        try {
          var s = localStorage.getItem('banggai_lang'), n = (navigator.language || '').slice(0, 2).toLowerCase();
          if (s === 'ID' || (!s && n === 'id')) t = 'id'; else if (s === 'ES' || (!s && n === 'es')) t = 'es';
        } catch (e) {}
        if (langs.indexOf(t) < 0) t = 'eng';
        location.replace('/' + t + '/blog/beyond-paisu-pok-peleng-island-guide/' + location.search + location.hash);
      })();
    </script>
