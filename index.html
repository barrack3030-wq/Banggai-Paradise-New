<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banggai Islands Tour &amp; Travel Agency | Banggai Paradise</title>
    <meta name="description" content="Banggai Paradise is a local travel agency in Luwuk offering Banggai Islands tour packages: Paisu Pok Lake, Pulau Dua, private trips and open trips with local guides." />
    <link rel="canonical" href="https://banggaiparadise.com/eng/" />
    <meta http-equiv="refresh" content="0;url=/eng/" />
    <!-- Static redirect stub (GitHub Pages cannot send a 301). Language pages live under /id/, /eng/ and /es/. -->
    <script>
      (function () {
        var langs = ["id", "eng", "es"], t = 'eng';
        try {
          var s = localStorage.getItem('banggai_lang'), n = (navigator.language || '').slice(0, 2).toLowerCase();
          if (s === 'ID' || (!s && n === 'id')) t = 'id'; else if (s === 'ES' || (!s && n === 'es')) t = 'es';
        } catch (e) {}
        if (langs.indexOf(t) < 0) t = 'eng';
        location.replace('/' + t + '/' + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/eng/">/eng/</a>…</p>
  </body>
</html>
