<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Banggai Tour: 6-Day Complete Route | Banggai Paradise</title>
    <meta name="description" content="The most complete Banggai Islands route in 6 days with local guides: marine lakes, beaches, small islands and local culture." />
    <link rel="canonical" href="https://banggaiparadise.com/eng/packages/ultimate-banggai/" />
    <meta http-equiv="refresh" content="0;url=/eng/packages/ultimate-banggai/" />
    <!-- Static redirect stub (GitHub Pages cannot send a 301). Language pages live under /id/, /eng/ and /es/. -->
    <script>
      (function () {
        var langs = ["id", "eng", "es"], t = 'eng';
        try {
          var s = localStorage.getItem('banggai_lang'), n = (navigator.language || '').slice(0, 2).toLowerCase();
          if (s === 'ID' || (!s && n === 'id')) t = 'id'; else if (s === 'ES' || (!s && n === 'es')) t = 'es';
        } catch (e) {}
        if (langs.indexOf(t) < 0) t = 'eng';
        location.replace('/' + t + '/packages/ultimate-banggai/' + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/eng/packages/ultimate-banggai/">/eng/packages/ultimate-banggai/</a>…</p>
  </body>
</html>
