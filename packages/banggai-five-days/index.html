<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banggai Tour 5 Days 4 Nights | Banggai Paradise</title>
    <meta name="description" content="Banggai tour for 5 days and 4 nights: Peleng, Paisu Pok and nearby islands at a relaxed pace. See the itinerary and ask about dates." />
    <link rel="canonical" href="https://banggaiparadise.com/eng/packages/banggai-five-days/" />
    <meta http-equiv="refresh" content="0;url=/eng/packages/banggai-five-days/" />
    <!-- Static redirect stub (GitHub Pages cannot send a 301). Language pages live under /id/, /eng/ and /es/. -->
    <script>
      (function () {
        var langs = ["id", "eng", "es"], t = 'eng';
        try {
          var s = localStorage.getItem('banggai_lang'), n = (navigator.language || '').slice(0, 2).toLowerCase();
          if (s === 'ID' || (!s && n === 'id')) t = 'id'; else if (s === 'ES' || (!s && n === 'es')) t = 'es';
        } catch (e) {}
        if (langs.indexOf(t) < 0) t = 'eng';
        location.replace('/' + t + '/packages/banggai-five-days/' + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/eng/packages/banggai-five-days/">/eng/packages/banggai-five-days/</a>…</p>
  </body>
</html>
