    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"¿En qué provincia están las islas Banggai?","acceptedAnswer":{"@type":"Answer","text":"En Sulawesi Central, en el extremo oriental de la provincia. El grupo de islas está separado de tierra firme de Sulawesi por el estrecho de Peleng."}},{"@type":"Question","name":"¿Banggai Laut es lo mismo que Banggai Kepulauan?","acceptedAnswer":{"@type":"Answer","text":"No. Son regencias distintas. Banggai Laut se creó mediante la Ley n.º 5 de 2013 a partir de siete distritos que antes pertenecían a Banggai Kepulauan, que hoy tiene su centro en la isla de Peleng."}},{"@type":"Question","name":"¿Qué ciudad es la puerta de entrada a las islas Banggai?","acceptedAnswer":{"@type":"Answer","text":"Luwuk, capital de la regencia de Banggai en tierra firme de Sulawesi. Tiene aeropuerto y puerto, y el viaje a las islas continúa por mar."}},{"@type":"Question","name":"¿Seguro que veré el pez cardenal de Banggai al hacer snorkel?","acceptedAnswer":{"@type":"Answer","text":"No, y un operador responsable no lo promete. Su distribución es irregular y la fauna se mueve según las condiciones naturales. Obsérvalo desde una distancia segura y sin tocar el coral."}},{"@type":"Question","name":"¿Cuál es la mejor época para visitar las islas Banggai?","acceptedAnswer":{"@type":"Answer","text":"Ningún mes garantiza un tiempo despejado y un mar en calma. Consulta el pronóstico de olas de BMKG entre dos y tres días antes de salir y otra vez la mañana de la travesía, y reserva un día de margen."}}]}</script>
