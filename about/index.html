<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Banggai Paradise | Local Travel Agency in Luwuk &amp; Banggai</title>
    <meta name="description" content="Meet Banggai Paradise, a local travel agency in Luwuk helping visitors plan tours and private trips across the Banggai Islands with local guides." />
    <link rel="canonical" href="https://banggaiparadise.com/eng/about/" />
    <meta http-equiv="refresh" content="0;url=/eng/about/" />
    <!-- Static redirect stub (GitHub Pages cannot send a 301). Language pages live under /id/, /eng/ and /es/. -->
    <script>
      (function () {
        var langs = ["id", "eng", "es"], t = 'eng';
        try {
          var s = localStorage.getItem('banggai_lang'), n = (navigator.language || '').slice(0, 2).toLowerCase();
          if (s === 'ID' || (!s && n === 'id')) t = 'id'; else if (s === 'ES' || (!s && n === 'es')) t = 'es';
        } catch (e) {}
        if (langs.indexOf(t) < 0) t = 'eng';
        location.replace('/' + t + '/about/' + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/eng/about/">/eng/about/</a>…</p>
  </body>
</html>
