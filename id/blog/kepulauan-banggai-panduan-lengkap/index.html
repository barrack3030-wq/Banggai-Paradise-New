    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Kepulauan Banggai ada di provinsi mana?","acceptedAnswer":{"@type":"Answer","text":"Di Sulawesi Tengah, tepatnya di ujung timur provinsi itu. Gugusan pulau ini dipisahkan dari daratan Sulawesi oleh Selat Peleng."}},{"@type":"Question","name":"Apakah Banggai Laut sama dengan Banggai Kepulauan?","acceptedAnswer":{"@type":"Answer","text":"Bukan. Keduanya kabupaten yang terpisah. Banggai Laut dibentuk lewat Undang-Undang Nomor 5 Tahun 2013 dari tujuh kecamatan yang sebelumnya masuk Banggai Kepulauan, yang kini berpusat di Pulau Peleng."}},{"@type":"Question","name":"Kota mana yang menjadi gerbang ke Kepulauan Banggai?","acceptedAnswer":{"@type":"Answer","text":"Luwuk, ibu kota Kabupaten Banggai di daratan Sulawesi. Kota ini punya bandara dan pelabuhan, dan perjalanan ke pulau dilanjutkan lewat laut."}},{"@type":"Question","name":"Apakah ikan capungan Banggai pasti terlihat saat snorkeling?","acceptedAnswer":{"@type":"Answer","text":"Tidak, dan operator yang bertanggung jawab tidak akan menjanjikannya. Sebarannya tidak merata dan satwa bergerak mengikuti kondisi alam. Amati dari jarak aman tanpa menyentuh karang."}},{"@type":"Question","name":"Kapan waktu terbaik ke Kepulauan Banggai?","acceptedAnswer":{"@type":"Answer","text":"Tidak ada bulan yang dijamin cerah dan tenang. Pantau prakiraan gelombang BMKG dua sampai tiga hari sebelum berangkat dan lagi pada pagi hari penyeberangan, lalu sisakan satu hari cadangan."}}]}</script>
